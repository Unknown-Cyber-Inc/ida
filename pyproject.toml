[project]
name = "unknowncyber-ida-plugin"
version = "1.1.0"
description = "Unknown Cyber MAGIC integration for IDA Pro 9.x"
requires-python = ">=3.8"
license = { text = "Proprietary" }

[tool.ruff]
line-length = 140
target-version = "py38"
src = ["plugins", "tests"]

[tool.ruff.format]
# Newer ruff versions also format fenced Python blocks in Markdown; keep docs out of CI.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008", "B009", "B010"]

[tool.pytest.ini_options]
testpaths = ["tests"]
